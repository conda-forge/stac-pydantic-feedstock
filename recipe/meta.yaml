{% set version = "3.5.1" %}

package:
  name: stac-pydantic
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/s/stac-pydantic/stac_pydantic-{{ version }}.tar.gz
  sha256: 1332136b5b4b80a8fbb0b40b02d1ea6ff220b9f7f33f72886d4cfb4966fca3b9

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - stac-pydantic = stac_pydantic.scripts.cli:app

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - click >=8.1.7
    - pydantic >=2.4.1
    - geojson-pydantic >=1.0.0
test:
  imports:
    - stac_pydantic
  commands:
    - pip check
    - stac-pydantic --help
  requires:
    - pip
    - python {{ python_min }}
    - requests

about:
  home: https://github.com/CS-SI/stac-pydantic
  summary: Pydantic data models for the STAC spec
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gadomski
    - sbrunato
